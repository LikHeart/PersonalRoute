spring.application.name=PersonalRoute
base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3.5:9b
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.chat.metadata=INFO

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

spring.datasource.url=jdbc:postgresql://localhost:5432/personalroute
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

jwt.secret=${JWT_SECRET}