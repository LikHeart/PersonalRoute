spring.application.name=PersonalRoute
server.port=8080
server.address=0.0.0.0

# --- Безопасность ---
jwt.secret=${JWT_SECRET}

# --- AI ---
base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=qwen3.5:9b

# --- Ошибки (скрываем детали) ---
server.error.include-message=never
server.error.include-stacktrace=never

# --- Логирование ---
logging.level.org.springframework.web.client=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.hibernate.SQL=WARN

# --- Почта ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# --- База данных (prod) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/personalroute}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Hibernate (prod: никаких update, только validate) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Thymeleaf ---
spring.thymeleaf.cache=true